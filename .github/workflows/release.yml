name: Release

# PKG-004 / SUP-008 — publish workflow with npm provenance + an SBOM per
# published package. Triggered on a version tag push (e.g. `v0.2.0`), not
# on every push to main, so a release is always a deliberate, tagged act.
#
# Honest limitation (recorded in security-review-report.json, not just
# here): this workflow has not been run against the real npm registry —
# doing that needs a real tag push and registry credentials this pass has
# no access to. It resolves "no publish workflow / no provenance / no
# SBOM" by making the missing capability exist; whether it actually
# succeeds end to end still needs a human to configure the trusted
# publisher / token and push a real tag.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # required for npm provenance (OIDC) — see https://docs.npmjs.com/generating-provenance-statements

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: "https://registry.npmjs.org"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      # Every package under packages/* whose own package.json declares
      # `"private": false` — determined at run time from the checked-out
      # tree, not a hardcoded list, so adding or removing a publishable
      # package here never needs a matching edit to this workflow.
      - name: Publish each publishable package with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for dir in packages/*/; do
            pkg="${dir%/}"
            if [ ! -f "$pkg/package.json" ]; then continue; fi
            private=$(node -p "require('./$pkg/package.json').private === true")
            if [ "$private" = "true" ]; then
              echo "skip $pkg (private)"
              continue
            fi
            name=$(node -p "require('./$pkg/package.json').name")
            echo "publishing $name from $pkg"
            npm publish "./$pkg" --provenance --access public
          done

      # SUP-008 — a CycloneDX SBOM per publishable package, uploaded as a
      # build artifact attached to this workflow run (not committed to the
      # repo — an SBOM describes one built/published artifact, and a
      # tag/run is exactly that scope).
      - name: Generate SBOM per published package
        run: |
          set -euo pipefail
          mkdir -p sbom
          for dir in packages/*/; do
            pkg="${dir%/}"
            if [ ! -f "$pkg/package.json" ]; then continue; fi
            private=$(node -p "require('./$pkg/package.json').private === true")
            if [ "$private" = "true" ]; then continue; fi
            name=$(node -p "require('./$pkg/package.json').name" | sed 's|/|__|')
            (cd "$pkg" && npm sbom --sbom-format cyclonedx --omit=dev) > "sbom/${name}.cdx.json"
          done

      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.ref_name }}
          path: sbom/*.cdx.json
          if-no-files-found: error
