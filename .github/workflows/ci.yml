name: CI

on:
  push:
  pull_request:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 26 executes every line of AgentGuard's own code (TRD §2.1.1,
      # bunfig.toml) — Bun below is used only to install dependencies and
      # run the package.json scripts, never as the runtime under test.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Dependency vulnerability scan (osv-scanner)
        # SUP-003 — bun.lock has no npm-audit equivalent. osv-scanner isn't
        # published to npm (confirmed: `bunx osv-scanner` 404s against the
        # registry), so it's installed from its own GitHub release instead.
        run: |
          curl -sL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner
          osv-scanner scan --lockfile=bun.lock

      - name: Audit fixture discriminability
        run: node packages/cli/dist/index.js audit-fixtures --fixtures fixtures/golden

  npm-compat:
    # security-check.md §5.9 / SUP-002 / SUP-003 — this repo is bun-managed
    # day to day, but package-lock.json is committed specifically so a
    # plain `npm ci --ignore-scripts` and `npm audit` remain real,
    # independently-runnable checks (not something either review role can
    # silently substitute a bun-only tool for).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: npm ci --ignore-scripts
        run: npm ci --ignore-scripts

      - name: npm run build
        run: npm run build

      - name: npm test
        run: npm test

      - name: npm audit (production dependencies only)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    needs: build-test-lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Install Playwright browsers
        run: bunx --cwd packages/playwright playwright install --with-deps chromium

      - name: Run e2e suite
        run: bun run test:e2e
